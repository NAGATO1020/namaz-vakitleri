# Etiket gönderilince sürümü GitHub yayınlar.
#
#   git tag -a v1.2.3 -m "Yaz saati düzeltmesi." && git push origin v1.2.3
#
# Sonrası kendiliğinden olur: testler koşar, imzalı APK derlenir, release
# oluşturulur, APK eklenir ve en son `update.json` güncellenir. Sıra önemli —
# manifest release'den önce yayımlanırsa uygulama bir süre "güncelleme var"
# deyip indiremez (bkz. tool/RELEASE.md).
name: Sürüm yayınla

on:
  push:
    tags:
      - 'v*'

# Release oluşturmak ve update.json'u main'e göndermek için.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # update.json'u main'e geri gönderebilmek için tam geçmiş.
          fetch-depth: 0

      # İmza anahtarı yoksa DURMALIYIZ. Sessizce devam edilirse APK hata
      # ayıklama anahtarıyla imzalanır; Android onu mevcut kurulumun üstüne
      # koymayı reddeder ve kullanıcılar uygulamayı silip yeniden kurmak
      # zorunda kalır. Bu yüzden derlemeden önce kontrol ediyoruz.
      - name: İmza anahtarı var mı
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          eksik=""
          [ -z "$KEYSTORE_BASE64" ]   && eksik="$eksik KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && eksik="$eksik KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && eksik="$eksik KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && eksik="$eksik KEY_PASSWORD"
          if [ -n "$eksik" ]; then
            echo "::error::Eksik secret:$eksik — Settings ▸ Secrets and variables ▸ Actions"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Dart testleri
        run: flutter test

      - name: Android testleri
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # key.properties bir Java properties dosyası; Linux yollarında ters
          # bölü olmadığı için kaçış sorunu yok (Windows'ta vardı).
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: APK derle
        run: flutter build apk --release --split-per-abi

      # Hata ayıklama anahtarıyla imzalanmış bir APK yayınlamak, havadan
      # güncellemeyi kalıcı olarak kırar. Yayınlamadan önce imzayı doğruluyoruz.
      - name: İmzayı doğrula
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" verify --print-certs "$apk" | tee /tmp/imza.txt
          if grep -q "CN=Android Debug" /tmp/imza.txt; then
            echo "::error::APK hata ayıklama anahtarıyla imzalanmış — yayınlanmadı."
            exit 1
          fi

      - name: Sürüm bilgisini çıkar
        id: surum
        run: |
          tag="${GITHUB_REF_NAME}"
          # pubspec: "version: 1.2.3+6"
          ham=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          ad="${ham%%+*}"
          yapi="${ham##*+}"

          if [ "v$ad" != "$tag" ]; then
            echo "::error::Etiket ($tag) ile pubspec sürümü ($ad) uyuşmuyor."
            exit 1
          fi

          # --split-per-abi ile Flutter versionCode'a mimari ofseti ekler;
          # arm64-v8a için +2000. Yayınlanan APK bu, manifestteki sayı da onun
          # gerçek değeri olmalı.
          echo "ad=$ad" >> "$GITHUB_OUTPUT"
          echo "kod=$((yapi + 2000))" >> "$GITHUB_OUTPUT"

          # Yalnızca ilk satır; çok satırlı etiket mesajı çıktıyı bozmasın.
          notlar=$(git tag -l --format='%(contents:subject)' "$tag" | head -1)
          [ -z "$notlar" ] && notlar="$ad sürümü."
          echo "notlar=$notlar" >> "$GITHUB_OUTPUT"

      # Önce release — manifest ondan sonra.
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AD: ${{ steps.surum.outputs.ad }}
          NOTLAR: ${{ steps.surum.outputs.notlar }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$AD" \
            --notes "$NOTLAR" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: update.json'u güncelle
        env:
          AD: ${{ steps.surum.outputs.ad }}
          KOD: ${{ steps.surum.outputs.kod }}
          NOTLAR: ${{ steps.surum.outputs.notlar }}
        run: |
          # Etiketten çalıştığımız için HEAD ayrık; main'in ucuna geçiyoruz ki
          # bu arada gelen başka bir commit ezilmesin.
          git fetch origin main
          git checkout -B main origin/main

          # JSON'u jq kuruyor: sürüm notunda tırnak ya da ters bölü olsa da
          # dosya bozulmasın.
          jq -n \
            --argjson versionCode "$KOD" \
            --arg versionName "$AD" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-arm64-v8a-release.apk" \
            --arg notes "$NOTLAR" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: $notes, mandatory: false}' \
            > update.json
          cat update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          # Aynı sürüm yeniden yayınlanırsa değişiklik olmayabilir.
          git diff --cached --quiet && echo "update.json zâten güncel" && exit 0
          git commit -m "$AD güncellemesini duyur"
          git push origin main
